<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundwise</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#eef1ec!important;color-scheme:light!important;min-height:100vh}
body{font-family:'DM Sans',sans-serif;color:#111a14;-webkit-font-smoothing:antialiased}
button,input{font-family:'DM Sans',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeUp .3s ease both}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.slidedown{animation:slideDown .25s ease both}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

/* ── YOUR FUNDS — already invested ── */
const FUNDS_RAW = [
  {name:"Mirae Asset Large Cap",    cat:"Large Cap",  nav:98.45,  units:245.32, buyNav:72.10, sip:5000, ret1y:12.4, overlap:72},
  {name:"Axis Bluechip Fund",       cat:"Large Cap",  nav:52.30,  units:180.50, buyNav:41.20, sip:3000, ret1y:10.1, overlap:72},
  {name:"HDFC Mid-Cap Opportunities",cat:"Mid Cap",   nav:134.20, units:89.10,  buyNav:88.40, sip:3000, ret1y:22.1, overlap:34},
  {name:"Parag Parikh Flexi Cap",   cat:"Flexi Cap",  nav:71.80,  units:320.00, buyNav:48.30, sip:5000, ret1y:18.9, overlap:28},
  {name:"SBI Small Cap Fund",       cat:"Small Cap",  nav:145.60, units:55.20,  buyNav:95.30, sip:2000, ret1y:31.2, overlap:18},
  {name:"Kotak Gold Fund",          cat:"Gold",       nav:22.15,  units:890.00, buyNav:16.40, sip:2000, ret1y:19.8, overlap:5},
  {name:"ICICI Pru Balanced Advantage",cat:"Hybrid",  nav:62.40,  units:210.40, buyNav:52.10, sip:3000, ret1y:14.2, overlap:41},
  {name:"DSP Nifty 50 Index Fund",  cat:"Index",      nav:28.90,  units:520.00, buyNav:22.10, sip:3000, ret1y:13.8, overlap:85},
  {name:"UTI Nifty Next 50 Index",  cat:"Index",      nav:18.40,  units:610.00, buyNav:14.20, sip:2000, ret1y:15.2, overlap:85},
];

/* ── SUGGESTED FUNDS — not yet invested, recommended for diversification ── */
const SUGGESTED_FUNDS = [
  {name:"Motilal Oswal Nasdaq 100",  cat:"International", nav:118.40, reason:"No international exposure in your portfolio. Adds geographic diversification.", overlap:5},
  {name:"HDFC Corporate Bond Fund",  cat:"Debt",          nav:28.72,  reason:"Your portfolio has no debt allocation. Adds stability and reduces overall volatility.", overlap:3},
  {name:"Nippon India Small Cap",    cat:"Small Cap",     nav:92.15,  reason:"Different small-cap focus than SBI Small Cap — adds within-category diversification.", overlap:22},
];

function enrich(f) {
  const cv = f.nav * f.units, iv = f.buyNav * f.units;
  const gainPct = ((cv - iv) / iv * 100).toFixed(1);
  const seed = (f.nav * 7.3) % 1;
  let signal = "hold";
  if (f.ret1y > 25 && seed > 0.45) signal = "exit";
  else if (f.ret1y < 16 && seed < 0.45) signal = "invest";
  // Compute suggested action amounts
  // For invest: suggest investing ~20-25% more than SIP on a dip day
  // For exit: suggest exiting ~15-20% of current value
  let actionAmt = 0, actionUnits = 0;
  if (signal === "invest") {
    actionAmt = Math.round(f.sip * 1.2 / 100) * 100; // round to nearest 100
    actionUnits = parseFloat((actionAmt / f.nav).toFixed(2));
  } else if (signal === "exit") {
    actionAmt = Math.round(cv * 0.18 / 100) * 100;
    actionUnits = parseFloat((actionAmt / f.nav).toFixed(2));
  }
  return { ...f, cv, iv, gainPct, signal, actionAmt, actionUnits };
}
const FUNDS = FUNDS_RAW.map(enrich);

const SAMPLE_CSV = `Fund Name,Category,Current NAV (₹),Units Held,Purchase NAV (₹),Monthly SIP (₹),SIP Date,1Y Return (%),Overlap Score
Mirae Asset Large Cap Fund,Large Cap,98.45,245.32,72.10,5000,5,12.4,72
Axis Bluechip Fund,Large Cap,52.30,180.50,41.20,3000,5,10.1,72
HDFC Mid-Cap Opportunities Fund,Mid Cap,134.20,89.10,88.40,3000,10,22.1,34
Parag Parikh Flexi Cap Fund,Flexi Cap,71.80,320.00,48.30,5000,7,18.9,28
SBI Small Cap Fund,Small Cap,145.60,55.20,95.30,2000,3,31.2,18
Kotak Gold Fund,Gold,22.15,890.00,16.40,2000,15,19.8,5
ICICI Pru Balanced Advantage Fund,Hybrid,62.40,210.40,52.10,3000,12,14.2,41
DSP Nifty 50 Index Fund,Index,28.90,520.00,22.10,3000,1,13.8,85
UTI Nifty Next 50 Index Fund,Index,18.40,610.00,14.20,2000,1,15.2,85`;

function downloadSampleCSV() {
  const blob = new Blob([SAMPLE_CSV], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "sample_portfolio.csv"; a.click();
  URL.revokeObjectURL(url);
}

const S = {
  page:     { minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"2rem 1rem", background:"#eef1ec" },
  pageTop:  { minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", padding:"2rem 1rem 6rem 1rem", background:"#eef1ec" },
  card:     { background:"#fff", borderRadius:20, border:"1px solid #e8ebe6", padding:"2.5rem", width:"100%", maxWidth:480, boxShadow:"0 2px 8px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.04)" },
  cardWide: { background:"#fff", borderRadius:20, border:"1px solid #e8ebe6", padding:"2rem 2.5rem", width:"100%", maxWidth:720, boxShadow:"0 2px 8px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.04)" },
  h1:    { fontFamily:"'DM Serif Display',serif", fontSize:30, color:"#111a14", lineHeight:1.25, marginBottom:"0.6rem" },
  h2:    { fontFamily:"'DM Serif Display',serif", fontSize:22, color:"#111a14", lineHeight:1.3, marginBottom:"0.5rem" },
  sub:   { fontSize:15, color:"#5a6b5e", lineHeight:1.65, marginBottom:"2rem" },
  label: { fontSize:12, fontWeight:500, color:"#5a6b5e", textTransform:"uppercase", letterSpacing:"0.6px", display:"block", marginBottom:7 },
  input: { width:"100%", border:"1px solid #e8ebe6", borderRadius:8, padding:"12px 14px", fontSize:15, color:"#111a14", background:"#fff", outline:"none" },
  btnPrimary: { width:"100%", padding:"13px 20px", background:"#1a6b3a", color:"#fff", border:"none", borderRadius:8, fontSize:15, fontWeight:500, cursor:"pointer", marginTop:10 },
  btnSec:     { padding:"10px 16px", background:"transparent", color:"#111a14", border:"1px solid #e8ebe6", borderRadius:8, fontSize:14, fontWeight:500, cursor:"pointer" },
  btnGhost:   { background:"none", border:"none", color:"#1a6b3a", fontSize:13, cursor:"pointer", textDecoration:"underline", textUnderlineOffset:3 },
};

function Logo({ noMargin }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:noMargin?0:"2.5rem" }}>
      <div style={{ width:36, height:36, background:"#1a6b3a", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center" }}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 14l4-5 3.5 3.5L15 6" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
          <circle cx="15.5" cy="5.5" r="1.8" fill="white"/>
        </svg>
      </div>
      <span style={{ fontFamily:"'DM Serif Display',serif", fontSize:22, color:"#111a14" }}>Fundwise</span>
    </div>
  );
}

function StepDots({ active }) {
  return (
    <div style={{ display:"flex", gap:8, marginBottom:"2rem" }}>
      {[0,1,2].map(i => <div key={i} style={{ height:6, borderRadius:3, background:i===active?"#1a6b3a":"#e8ebe6", width:i===active?20:6, transition:"all .2s" }} />)}
    </div>
  );
}

function Badge({ children, v="cat" }) {
  const map = {
    cat:     { bg:"#e8f5ee", c:"#1a6b3a" },
    overlap: { bg:"#fdf0ee", c:"#c0392b" },
    invest:  { bg:"#e8f5ee", c:"#1a6b3a" },
    exit:    { bg:"#fdf8ee", c:"#b7860b" },
    ok:      { bg:"#e8f5ee", c:"#1a6b3a" },
    warn:    { bg:"#fdf8ee", c:"#b7860b" },
    suggest: { bg:"#eef4fd", c:"#2563a8" },
  };
  const s = map[v] || map.cat;
  return <span style={{ background:s.bg, color:s.c, fontSize:11, fontWeight:500, borderRadius:6, padding:"3px 9px", whiteSpace:"nowrap" }}>{children}</span>;
}

/* ─── WELCOME ─── */
function Welcome({ onNext }) {
  return (
    <div style={S.page}>
      <div style={S.card} className="fadein">
        <Logo />
        <h1 style={S.h1}>Invest smartly,<br/>not just regularly.</h1>
        <p style={S.sub}>Most SIPs run on autopilot — fixed date, no thought. Fundwise tells you when to invest more and when to step back, based on where your funds actually are today.</p>
        <div style={{ marginBottom:"2rem" }}>
          {[
            ["More than SIP",       "Time your investments within the month"],
            ["Less than trading",   "No stocks, no daily charts, no noise"],
            ["Daily nudges",        "WhatsApp & call when there's something to act on"],
            ["You stay in control", "Suggestions only — every action is yours to take"],
          ].map(([t,d]) => (
            <div key={t} style={{ display:"flex", alignItems:"flex-start", gap:12, marginBottom:14 }}>
              <div style={{ width:20, height:20, borderRadius:"50%", background:"#e8f5ee", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:2 }}>
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#1a6b3a" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
              <div>
                <span style={{ fontSize:14, fontWeight:500 }}>{t}</span>
                <span style={{ fontSize:13, color:"#5a6b5e" }}> — {d}</span>
              </div>
            </div>
          ))}
        </div>
        <button style={S.btnPrimary} onClick={onNext}>Get started</button>
      </div>
    </div>
  );
}

/* ─── PHONE ─── */
function PhoneScreen({ onNext }) {
  const [phone, setPhone] = useState("");
  const [otp, setOtp] = useState("");
  const [sent, setSent] = useState(false);
  const [loading, setLoading] = useState(false);
  const sendOtp = () => { setLoading(true); setTimeout(() => { setLoading(false); setSent(true); }, 700); };
  const verify  = () => { setLoading(true); setTimeout(() => { setLoading(false); onNext(phone); }, 700); };
  return (
    <div style={S.page}>
      <div style={S.card} className="fadein">
        <Logo />
        <StepDots active={0} />
        {!sent ? (
          <>
            <h2 style={S.h2}>What's your number?</h2>
            <p style={S.sub}>We'll send a one-time password to verify your identity.</p>
            <label style={S.label}>Mobile number</label>
            <div style={{ display:"flex", gap:8, marginBottom:10 }}>
              <div style={{ border:"1px solid #e8ebe6", borderRadius:8, padding:"0 14px", display:"flex", alignItems:"center", fontSize:15, color:"#5a6b5e", background:"#f8f9f7", whiteSpace:"nowrap" }}>+91</div>
              <input style={S.input} type="tel" maxLength={10} placeholder="98765 43210" value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g,"").slice(0,10))} autoFocus />
            </div>
            <button style={{ ...S.btnPrimary, opacity:phone.length===10&&!loading?1:0.4 }} disabled={phone.length!==10||loading} onClick={sendOtp}>
              {loading?"Sending…":"Send OTP"}
            </button>
          </>
        ) : (
          <>
            <h2 style={S.h2}>Enter OTP</h2>
            <p style={S.sub}>Sent to +91 {phone}. Enter the 6-digit code.</p>
            <label style={S.label}>One-time password</label>
            <input style={{ ...S.input, letterSpacing:10, fontSize:22, textAlign:"center", fontWeight:500, marginBottom:10 }} type="tel" maxLength={6} placeholder="· · · · · ·" value={otp} onChange={e=>setOtp(e.target.value.replace(/\D/g,"").slice(0,6))} autoFocus />
            <button style={{ ...S.btnPrimary, opacity:otp.length===6&&!loading?1:0.4 }} disabled={otp.length!==6||loading} onClick={verify}>
              {loading?"Verifying…":"Verify & continue"}
            </button>
            <button style={{ ...S.btnGhost, display:"block", marginTop:12, width:"100%", textAlign:"center" }} onClick={()=>{setSent(false);setOtp("");}}>Change number</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ─── UPLOAD ─── */
function UploadScreen({ onNext }) {
  const [analyzing, setAnalyzing] = useState(false);
  const [progress,  setProgress]  = useState(0);
  const fileRef = useRef();
  const steps = ["Reading fund names and NAVs","Checking category overlaps","Identifying diversification gaps","Running today's timing signals"];
  const start = () => {
    setAnalyzing(true); setProgress(0);
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random()*14+4;
      if (p >= 100) { clearInterval(iv); setProgress(100); setTimeout(onNext, 400); return; }
      setProgress(Math.min(p,99));
    }, 180);
  };
  if (analyzing) return (
    <div style={S.page}>
      <div style={S.card} className="fadein">
        <Logo />
        <h2 style={S.h2}>Analysing your portfolio</h2>
        <p style={{ ...S.sub, marginBottom:"1.5rem" }}>Just a few seconds.</p>
        <div style={{ height:4, background:"#e8f5ee", borderRadius:4, overflow:"hidden", marginBottom:"1.5rem" }}>
          <div style={{ height:"100%", background:"#1a6b3a", borderRadius:4, width:`${progress}%`, transition:"width .18s" }} />
        </div>
        {steps.map((t,i) => (
          <div key={t} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 0", borderBottom:"1px solid #e8ebe6" }}>
            <div style={{ width:18, height:18, borderRadius:"50%", background:progress>(i+1)*22?"#e8f5ee":"#f8f9f7", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              {progress>(i+1)*22 && <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#1a6b3a" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
            <span style={{ fontSize:13, color:progress>(i+1)*22?"#111a14":"#9aaa9d" }}>{t}</span>
          </div>
        ))}
      </div>
    </div>
  );
  return (
    <div style={S.page}>
      <div style={S.card} className="fadein">
        <Logo />
        <StepDots active={1} />
        <h2 style={S.h2}>Upload your portfolio</h2>
        <p style={S.sub}>Share your mutual fund statement from Groww, Zerodha, CAMS, Kfintech, or MFU. We read it, we analyse it — that's all we do with it.</p>
        <div onClick={()=>fileRef.current.click()} style={{ border:"1.5px dashed #d8e8d8", borderRadius:14, padding:"2.5rem 2rem", textAlign:"center", cursor:"pointer", background:"#f2faf5", marginBottom:"1.5rem" }}
          onMouseEnter={e=>e.currentTarget.style.borderColor="#2d8f52"} onMouseLeave={e=>e.currentTarget.style.borderColor="#d8e8d8"}>
          <div style={{ width:52, height:52, background:"#fff", borderRadius:14, border:"1px solid #e8ebe6", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 14px", boxShadow:"0 1px 3px rgba(0,0,0,.06)" }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d8f52" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p style={{ fontSize:15, fontWeight:500, marginBottom:4 }}>Drop your statement here</p>
          <p style={{ fontSize:13, color:"#5a6b5e", marginBottom:12 }}>CSV or Excel — from any broker</p>
          <button onClick={e=>{e.stopPropagation();downloadSampleCSV();}} style={{ background:"none", border:"1px solid #b8dfc6", borderRadius:6, padding:"5px 14px", fontSize:12, color:"#1a6b3a", cursor:"pointer", fontFamily:"'DM Sans',sans-serif" }}>
            ↓ Download sample file
          </button>
          <input ref={fileRef} type="file" accept=".csv,.xlsx" style={{ display:"none" }} onChange={start} />
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:12, margin:"0 0 1.25rem" }}>
          <div style={{ flex:1, height:1, background:"#e8ebe6" }}/><span style={{ fontSize:12, color:"#9aaa9d" }}>or</span><div style={{ flex:1, height:1, background:"#e8ebe6" }}/>
        </div>
        <button style={{ ...S.btnSec, width:"100%" }} onClick={start}>Load sample portfolio</button>
      </div>
    </div>
  );
}

/* ─── REVIEW ─── */
function ReviewScreen({ onNext }) {
  const [selected,          setSelected]          = useState(new Set(FUNDS.map(f=>f.name)));
  const [addedSuggestions,  setAddedSuggestions]  = useState(new Set());

  const sel     = FUNDS.filter(f=>selected.has(f.name));
  const hiOv    = sel.filter(f=>f.overlap>70);
  const existingCats = new Set(sel.map(f=>f.cat));
  const score   = Math.min(95,Math.max(40,70+Math.min(existingCats.size*4,20)-hiOv.length*8));
  const C = 2*Math.PI*28, dash = (score/100)*C;

  const toggle    = n => setSelected(p => { const s=new Set(p); s.has(n)?s.delete(n):s.add(n); return s; });
  const toggleAll = () => setSelected(p => p.size===FUNDS.length?new Set():new Set(FUNDS.map(f=>f.name)));
  const toggleSug = n => setAddedSuggestions(p => { const s=new Set(p); s.has(n)?s.delete(n):s.add(n); return s; });

  const totalTracked = selected.size + addedSuggestions.size;

  return (
    <div style={S.pageTop}>
      <div style={{ ...S.cardWide, marginTop:0 }} className="fadein">
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"2rem" }}>
          <Logo noMargin /><StepDots active={2} />
        </div>

        {/* Health score */}
        <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:"1.5rem" }}>
          <div style={{ position:"relative", width:72, height:72, flexShrink:0 }}>
            <svg width="72" height="72" viewBox="0 0 72 72" style={{ transform:"rotate(-90deg)" }}>
              <circle cx="36" cy="36" r="28" fill="none" stroke="#e8ebe6" strokeWidth="6"/>
              <circle cx="36" cy="36" r="28" fill="none" stroke="#1a6b3a" strokeWidth="6" strokeDasharray={`${dash} ${C}`} strokeLinecap="round"/>
            </svg>
            <div style={{ position:"absolute", top:"50%", left:"50%", transform:"translate(-50%,-50%)", fontSize:16, fontWeight:600, color:"#1a6b3a" }}>{score}</div>
          </div>
          <div>
            <h2 style={{ ...S.h2, marginBottom:4 }}>Your portfolio, reviewed.</h2>
            <p style={{ fontSize:14, color:"#5a6b5e" }}>Health score: {score}/100. {hiOv.length>0?`${hiOv.length} fund${hiOv.length>1?"s":""} with high overlap.`:"Diversification looks good."}</p>
          </div>
        </div>

        {/* Overlap warning */}
        {hiOv.length>0 && (
          <div style={{ background:"#fffbeb", border:"1px solid #f0d070", borderRadius:10, padding:"12px 16px", marginBottom:"1.25rem", display:"flex", gap:10 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b7860b" strokeWidth="2" strokeLinecap="round" style={{ flexShrink:0, marginTop:1 }}><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <p style={{ fontSize:13, color:"#7a5c00", lineHeight:1.55 }}>
              <strong>{hiOv.slice(0,2).map(f=>f.name.split(" ").slice(0,2).join(" ")).join(" and ")}</strong> share {hiOv[0].overlap}% of holdings. They move together, limiting your opportunities to buy low and sell high. Consider keeping only one.
            </p>
          </div>
        )}

        {/* Existing funds */}
        <p style={{ fontSize:13, color:"#5a6b5e", marginBottom:"0.75rem" }}>Select the funds you want Fundwise to watch.</p>
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:"1.5rem" }}>
          {FUNDS.map(f => {
            const isSel = selected.has(f.name);
            return (
              <div key={f.name} onClick={()=>toggle(f.name)} style={{ display:"flex", alignItems:"center", gap:12, border:`1px solid ${isSel?"#2d8f52":"#e8ebe6"}`, borderRadius:14, padding:"14px 16px", cursor:"pointer", background:isSel?"#f2faf5":"#fff", transition:"all .12s" }}>
                <div style={{ width:20, height:20, borderRadius:6, border:isSel?"none":"1.5px solid #d0d8d0", background:isSel?"#1a6b3a":"#fff", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                  {isSel && <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:4 }}>
                    <span style={{ fontSize:14, fontWeight:500 }}>{f.name}</span>
                    <Badge v="cat">{f.cat}</Badge>
                    {f.overlap>70 && <Badge v="overlap">High overlap</Badge>}
                  </div>
                  <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
                    <span style={{ fontSize:12, color:"#5a6b5e" }}>₹{f.cv.toLocaleString("en-IN",{maximumFractionDigits:0})}</span>
                    <span style={{ fontSize:12, color:parseFloat(f.gainPct)>=0?"#1a6b3a":"#c0392b" }}>{f.gainPct>0?"+":""}{f.gainPct}% overall</span>
                    {f.sip>0 && <span style={{ fontSize:12, color:"#9aaa9d" }}>SIP ₹{f.sip.toLocaleString()}/mo</span>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderTop:"1px solid #e8ebe6", marginBottom:"1.5rem" }}>
          <span style={{ fontSize:13, color:"#5a6b5e" }}>{selected.size} of {FUNDS.length} funds selected</span>
          <button style={{ ...S.btnSec, fontSize:13, padding:"6px 14px" }} onClick={toggleAll}>{selected.size===FUNDS.length?"Deselect all":"Select all"}</button>
        </div>

        {/* Suggested funds section */}
        <div style={{ borderTop:"1px solid #e8ebe6", paddingTop:"1.25rem", marginBottom:"1.5rem" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
            <span style={{ fontSize:13, fontWeight:600, color:"#111a14" }}>Suggested for diversification</span>
            <Badge v="suggest">Recommended</Badge>
          </div>
          <p style={{ fontSize:13, color:"#5a6b5e", marginBottom:"1rem", lineHeight:1.55 }}>
            Based on your current holdings, these funds could fill gaps in your portfolio. Add them to get alerts when to invest.
          </p>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {SUGGESTED_FUNDS.map(f => {
              const isAdded = addedSuggestions.has(f.name);
              const alreadyHasCat = existingCats.has(f.cat);
              return (
                <div key={f.name} onClick={()=>toggleSug(f.name)} style={{ display:"flex", alignItems:"flex-start", gap:12, border:`1px solid ${isAdded?"#2563a8":"#dde8f8"}`, borderRadius:14, padding:"14px 16px", cursor:"pointer", background:isAdded?"#f0f6ff":"#f8fbff", transition:"all .12s" }}>
                  <div style={{ width:20, height:20, borderRadius:6, border:isAdded?"none":"1.5px solid #a8c4e8", background:isAdded?"#2563a8":"#fff", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:2 }}>
                    {isAdded && <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:5 }}>
                      <span style={{ fontSize:14, fontWeight:500 }}>{f.name}</span>
                      <Badge v="suggest">{f.cat}</Badge>
                      {!alreadyHasCat && <Badge v="ok">New category</Badge>}
                    </div>
                    <p style={{ fontSize:12, color:"#5a6b5e", lineHeight:1.5 }}>{f.reason}</p>
                  </div>
                  <span style={{ fontSize:12, color:isAdded?"#2563a8":"#9aaa9d", fontWeight:500, flexShrink:0, marginTop:2 }}>
                    {isAdded?"✓ Added":"+ Add"}
                  </span>
                </div>
              );
            })}
          </div>
        </div>

        {/* spacer so content isn't hidden under floating button */}
        <div style={{ height:16 }} />
      </div>
      {/* Floating save button */}
      <div style={{ position:"fixed", bottom:0, left:0, right:0, padding:"12px 16px 20px", background:"linear-gradient(to top, #eef1ec 60%, transparent)", zIndex:100, display:"flex", justifyContent:"center" }}>
        <button
          style={{ maxWidth:680, width:"100%", padding:"14px 24px", background:selected.size===0?"#9aaa9d":"#1a6b3a", color:"#fff", border:"none", borderRadius:12, fontSize:15, fontWeight:500, cursor:selected.size===0?"not-allowed":"pointer", boxShadow:"0 4px 20px rgba(26,107,58,.25)", transition:"background .2s" }}
          disabled={selected.size===0}
          onClick={()=>onNext([...selected], [...addedSuggestions])}
        >
          Save {totalTracked} fund{totalTracked!==1?"s":""}
          {addedSuggestions.size>0 && <span style={{ fontSize:13, fontWeight:400, opacity:0.85 }}> ({selected.size} yours · {addedSuggestions.size} suggested)</span>}
        </button>
      </div>
    </div>
  );
}

/* ─── DASHBOARD ─── */
function Dashboard({ phone, selectedNames, suggestedNames, onEdit }) {
  const [tab,       setTab]       = useState("today");
  const [waOn,      setWaOn]      = useState(false);
  const [callOn,    setCallOn]    = useState(false);
  const [toast,     setToast]     = useState(null);
  const [done,      setDone]      = useState(new Set());
  const [reminded,  setReminded]  = useState(new Set());
  const [dismissed, setDismissed] = useState(new Set());

  const showToast = (msg, color) => { setToast({msg,color}); setTimeout(()=>setToast(null),3000); };

  const selFunds  = FUNDS.filter(f=>selectedNames.has(f.name));
  const sugFunds  = SUGGESTED_FUNDS.filter(f=>suggestedNames.has(f.name));
  const totalVal  = selFunds.reduce((s,f)=>s+f.cv,0);
  const totalInv  = selFunds.reduce((s,f)=>s+f.iv,0);
  const gainPct   = totalInv>0?((totalVal-totalInv)/totalInv*100).toFixed(1):0;
  const sip       = selFunds.reduce((s,f)=>s+(f.sip||0),0);
  const suggestions = selFunds.filter(f=>(f.signal==="invest"||f.signal==="exit")&&!dismissed.has(f.name));

  return (
    <div style={S.pageTop}>
      {toast && (
        <div className="slidedown" style={{ position:"fixed", top:20, left:"50%", transform:"translateX(-50%)", background:toast.color, color:"#fff", borderRadius:10, padding:"10px 20px", fontSize:13, fontWeight:500, zIndex:1000, boxShadow:"0 4px 16px rgba(0,0,0,.15)", whiteSpace:"nowrap" }}>
          {toast.msg}
        </div>
      )}
      <div style={{ ...S.cardWide, marginTop:0 }} className="fadein">

        {/* Header */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"1.75rem" }}>
          <Logo noMargin />
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            {suggestions.length>0
              ? <Badge v="warn">{suggestions.length} suggestion{suggestions.length>1?"s":""} today</Badge>
              : <Badge v="ok">All clear today</Badge>}
            <div style={{ width:34, height:34, borderRadius:"50%", background:"#e8f5ee", display:"flex", alignItems:"center", justifyContent:"center" }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a6b3a" strokeWidth="2" strokeLinecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
          </div>
        </div>

        {/* Notification banner */}
        <div style={{ background:"#f2faf5", border:"1px solid #b8dfc6", borderRadius:14, padding:"16px 18px", marginBottom:"1.75rem" }}>
          <p style={{ fontSize:12, fontWeight:600, color:"#1a6b3a", marginBottom:12, textTransform:"uppercase", letterSpacing:"0.5px" }}>Stay notified</p>
          <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ width:36, height:36, background:"#25D366", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.136.559 4.14 1.535 5.878L0 24l6.302-1.513A11.942 11.942 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.898 0-3.67-.52-5.183-1.428l-.371-.22-3.742.898.939-3.638-.242-.381A9.96 9.96 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
              </div>
              <div style={{ flex:1 }}>
                <p style={{ fontSize:13, fontWeight:500, marginBottom:2 }}>WhatsApp alerts</p>
                <p style={{ fontSize:12, color:"#5a6b5e" }}>Message by 1:30 PM on days there's something to act on</p>
              </div>
              <button onClick={()=>{if(!waOn){setWaOn(true);showToast("✓ WhatsApp alerts enabled for +91 "+phone,"#1a6b3a");}}} style={{ padding:"7px 16px", borderRadius:8, border:"none", fontSize:13, fontWeight:500, cursor:"pointer", background:waOn?"#e8f5ee":"#1a6b3a", color:waOn?"#1a6b3a":"#fff", flexShrink:0, transition:"all .2s" }}>
                {waOn?"✓ Enabled":"Enable"}
              </button>
            </div>
            <div style={{ height:1, background:"#c8e8d0" }} />
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ width:36, height:36, background:"#3b82f6", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.13 1.16 2 2 0 012.11 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
              </div>
              <div style={{ flex:1 }}>
                <p style={{ fontSize:13, fontWeight:500, marginBottom:2 }}>Quick call reminder</p>
                <p style={{ fontSize:12, color:"#5a6b5e" }}>A short call at 2 PM to walk you through what to do today</p>
              </div>
              <button onClick={()=>{if(!callOn){setCallOn(true);showToast("✓ 2 PM call enabled for +91 "+phone,"#3b82f6");}}} style={{ padding:"7px 16px", borderRadius:8, border:"none", fontSize:13, fontWeight:500, cursor:"pointer", background:callOn?"#e8f0fe":"#3b82f6", color:callOn?"#1d4ed8":"#fff", flexShrink:0, transition:"all .2s" }}>
                {callOn?"✓ Enabled":"Enable"}
              </button>
            </div>
          </div>
        </div>

        {/* Metrics */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:"1.75rem" }}>
          {[
            { label:"Portfolio value", val:`₹${(totalVal/100000).toFixed(2)}L` },
            { label:"Overall gain",    val:`${gainPct>0?"+":""}${gainPct}%`, color:parseFloat(gainPct)>=0?"#1a6b3a":"#c0392b" },
            { label:"Monthly SIP",     val:`₹${sip.toLocaleString("en-IN")}` },
          ].map(m => (
            <div key={m.label} style={{ background:"#f8f9f7", border:"1px solid #e8ebe6", borderRadius:10, padding:"14px 16px" }}>
              <div style={{ fontSize:11, fontWeight:500, color:"#9aaa9d", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:5 }}>{m.label}</div>
              <div style={{ fontSize:20, fontWeight:500, color:m.color||"#111a14" }}>{m.val}</div>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{ display:"flex", gap:4, background:"#f8f9f7", borderRadius:10, padding:4, marginBottom:"1.5rem", width:"fit-content" }}>
          {[["today","Today's suggestions"],["funds","My funds"]].map(([id,label]) => (
            <button key={id} onClick={()=>setTab(id)} style={{ padding:"8px 18px", borderRadius:6, border:"none", fontSize:14, fontWeight:tab===id?500:400, color:tab===id?"#111a14":"#5a6b5e", background:tab===id?"#fff":"transparent", cursor:"pointer", boxShadow:tab===id?"0 1px 3px rgba(0,0,0,.08)":"none", transition:"all .12s" }}>
              {label}
            </button>
          ))}
        </div>

        {/* TODAY TAB */}
        {tab==="today" && (
          <div>
            {suggestions.length===0 ? (
              <div style={{ textAlign:"center", padding:"2.5rem 1rem" }}>
                <div style={{ width:56, height:56, background:"#e8f5ee", borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 14px" }}>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#1a6b3a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
                <p style={{ fontSize:16, fontWeight:500, marginBottom:6 }}>You're all set for today</p>
                <p style={{ fontSize:14, color:"#5a6b5e", maxWidth:320, margin:"0 auto", lineHeight:1.6 }}>No action needed. We check every day at 1:30 PM and will let you know when it's a good time to invest more or book partial profits.</p>
              </div>
            ) : (
              <>
                <p style={{ fontSize:13, color:"#5a6b5e", marginBottom:"1rem" }}>Based on today's NAV movement and your fund's recent pattern. These are suggestions — the final call is always yours.</p>
                {suggestions.map(f => {
                  const isDone     = done.has(f.name);
                  const isReminded = reminded.has(f.name);
                  const isInvest   = f.signal === "invest";
                  // Format the action amount clearly
                  const amtFormatted   = `₹${f.actionAmt.toLocaleString("en-IN")}`;
                  const unitsFormatted = `${f.actionUnits} units`;
                  return (
                    <div key={f.name} style={{ background:"#fff", border:"1px solid #e8ebe6", borderRadius:14, padding:"16px 18px", marginBottom:10, opacity:isDone?0.5:1, transition:"opacity .3s" }}>
                      {/* Header row */}
                      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, marginBottom:10 }}>
                        <div>
                          <p style={{ fontSize:14, fontWeight:500, marginBottom:6 }}>{f.name}</p>
                          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                            <Badge v="cat">{f.cat}</Badge>
                            <Badge v={isInvest?"invest":"exit"}>{isInvest?"Good time to invest":"Good time to book profit"}</Badge>
                          </div>
                        </div>
                        <button onClick={()=>setDismissed(p=>new Set([...p,f.name]))} style={{ background:"none", border:"none", color:"#9aaa9d", cursor:"pointer", fontSize:20, lineHeight:1, padding:2, flexShrink:0 }}>×</button>
                      </div>

                      {/* Reason */}
                      <p style={{ fontSize:13, color:"#5a6b5e", lineHeight:1.6, marginBottom:12 }}>
                        {isInvest
                          ? `${f.name.split(" ")[0]}'s NAV is near a 20-day low. A good window to add to this fund today rather than waiting for your usual SIP date.`
                          : `${f.name.split(" ")[0]} is up ${f.ret1y}% this year and near a recent high. Consider booking partial profits — you can reinvest when it dips.`}
                      </p>

                      {/* Action box — simplified */}
                      <div style={{ background:isInvest?"#f2faf5":"#fdf8ee", border:`1px solid ${isInvest?"#b8dfc6":"#e8d080"}`, borderRadius:10, padding:"14px 16px", marginBottom:12 }}>
                        <p style={{ fontSize:11, fontWeight:600, color:isInvest?"#1a6b3a":"#b7860b", marginBottom:6, textTransform:"uppercase", letterSpacing:"0.5px" }}>
                          {isInvest ? "Suggested action" : "Suggested action"}
                        </p>
                        <p style={{ fontSize:13, color:"#5a6b5e", marginBottom:6 }}>
                          {isInvest ? "Invest approximately" : "Exit approximately"}
                        </p>
                        <p style={{ fontSize:30, fontWeight:600, color:isInvest?"#1a6b3a":"#b7860b", lineHeight:1 }}>
                          {amtFormatted}
                        </p>
                        <p style={{ fontSize:12, color:"#9aaa9d", marginTop:8 }}>
                          {isInvest
                            ? `~1.2× your monthly SIP of ₹${f.sip.toLocaleString()} — timed to today's dip.`
                            : `~18% of your ₹${f.cv.toLocaleString("en-IN",{maximumFractionDigits:0})} holding. Partial exit only.`}
                        </p>
                      </div>

                      {/* Action buttons */}
                      <div style={{ display:"flex", gap:8 }}>
                        <button onClick={()=>{setDone(p=>new Set([...p,f.name]));showToast("Marked as done — great work!","#1a6b3a");}} style={{ flex:1, padding:"9px 14px", borderRadius:8, border:"1px solid #e8ebe6", background:isDone?"#e8f5ee":"#fff", color:isDone?"#1a6b3a":"#111a14", fontSize:13, fontWeight:500, cursor:"pointer", transition:"all .2s" }}>
                          {isDone?"✓ Done":"Mark as done"}
                        </button>
                        <button onClick={()=>{setReminded(p=>new Set([...p,f.name]));showToast("Reminder set for 2 PM today","#3b82f6");}} style={{ padding:"9px 14px", borderRadius:8, border:"1px solid #e8ebe6", background:isReminded?"#e8f0fe":"#fff", color:isReminded?"#1d4ed8":"#5a6b5e", fontSize:13, fontWeight:500, cursor:"pointer", transition:"all .2s" }}>
                          {isReminded?"✓ Reminder set":"Remind me later"}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}

        {/* FUNDS TAB */}
        {tab==="funds" && (
          <div>
            {selFunds.map(f => (
              <div key={f.name} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 0", borderBottom:"1px solid #e8ebe6" }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:3, flexWrap:"wrap" }}>
                    <span style={{ fontSize:14, fontWeight:500 }}>{f.name}</span>
                    <Badge v="cat">{f.cat}</Badge>
                  </div>
                  <span style={{ fontSize:12, color:"#5a6b5e" }}>₹{f.cv.toLocaleString("en-IN",{maximumFractionDigits:0})} · {((f.cv/totalVal)*100).toFixed(1)}% of portfolio</span>
                </div>
                <div style={{ textAlign:"right", flexShrink:0 }}>
                  <p style={{ fontSize:14, fontWeight:500, color:parseFloat(f.gainPct)>=0?"#1a6b3a":"#c0392b", marginBottom:2 }}>{f.gainPct>0?"+":""}{f.gainPct}%</p>
                  <p style={{ fontSize:11, color:"#9aaa9d" }}>NAV ₹{f.nav}</p>
                </div>
              </div>
            ))}
            {/* Suggested funds in my funds tab */}
            {sugFunds.length>0 && (
              <>
                <div style={{ padding:"10px 0 6px", marginTop:6 }}>
                  <span style={{ fontSize:12, fontWeight:500, color:"#9aaa9d", textTransform:"uppercase", letterSpacing:"0.5px" }}>Suggested — tracking for alerts</span>
                </div>
                {sugFunds.map(f => (
                  <div key={f.name} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 0", borderBottom:"1px solid #e8ebe6" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:3, flexWrap:"wrap" }}>
                        <span style={{ fontSize:14, fontWeight:500 }}>{f.name}</span>
                        <Badge v="suggest">{f.cat}</Badge>
                        <Badge v="suggest">Watching</Badge>
                      </div>
                      <span style={{ fontSize:12, color:"#5a6b5e" }}>NAV ₹{f.nav} · Not yet invested</span>
                    </div>
                    <div style={{ textAlign:"right", flexShrink:0 }}>
                      <p style={{ fontSize:12, color:"#9aaa9d" }}>Alert when</p>
                      <p style={{ fontSize:12, color:"#2563a8", fontWeight:500 }}>good to enter</p>
                    </div>
                  </div>
                ))}
              </>
            )}
            <div style={{ marginTop:"1rem", textAlign:"center" }}>
              <button style={S.btnGhost} onClick={onEdit}>Edit tracked funds</button>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

/* ─── ROOT ─── */
function App() {
  const [screen,         setScreen]         = useState("welcome");
  const [phone,          setPhone]          = useState("");
  const [selectedNames,  setSelectedNames]  = useState(new Set(FUNDS.map(f=>f.name)));
  const [suggestedNames, setSuggestedNames] = useState(new Set());
  return (
    <>
      {screen==="welcome"   && <Welcome onNext={()=>setScreen("phone")} />}
      {screen==="phone"     && <PhoneScreen onNext={p=>{setPhone(p);setScreen("upload");}} />}
      {screen==="upload"    && <UploadScreen onNext={()=>setScreen("review")} />}
      {screen==="review"    && <ReviewScreen onNext={(sel,sug)=>{setSelectedNames(new Set(sel));setSuggestedNames(new Set(sug));setScreen("dashboard");}} />}
      {screen==="dashboard" && <Dashboard phone={phone} selectedNames={selectedNames} suggestedNames={suggestedNames} onEdit={()=>setScreen("review")} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
